<!--
  Add to the agent's ossec.conf (or the manager's, if the app runs there) so the
  JSONL event log is shipped to the manager. Adjust the path to where the
  application writes its log.
-->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/ragdemo/ragdemo.jsonl</location>
</localfile>
