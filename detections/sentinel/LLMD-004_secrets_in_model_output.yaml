id: 874e47f5-508d-5422-97e2-bc9d3eabd081
name: LLMD-004 Credentials or financial identifiers in model output or tool arguments
description: |
  A completion, or the arguments of a tool call, contains a secret or financial identifier:
  AWS access keys, a secret next to a 40 character key, PEM private keys, GitHub and Slack
  tokens, Hungarian IBANs. Checking tool arguments matters: in agentic exfiltration the secret
  leaves through send_email or http_get and never shows up in the chat answer.
  Pattern matching is defeated by reformatting (see docs/coverage.md, evade-spaced-secret).
severity: High
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 5m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Collection
  - Exfiltration
relevantTechniques: []
tags:
  - OWASP-LLM02:2025 Sensitive Information Disclosure
  - ATLAS AML.T0057 LLM Data Leakage
query: |
  // KQL needs constant regexes, so each pattern is listed once for the filter and once for labelling.
  let aws_key = @"\b(AKIA|ASIA)[0-9A-Z]{16}\b";
  let secret_near_key = @"(?i:secret)[^\n]{0,20}[A-Za-z0-9/+]{40}";
  let private_key = @"-----BEGIN [A-Z ]*PRIVATE KEY-----";
  let github_token = @"\bgh[pousr]_[A-Za-z0-9]{36}\b";
  let slack_token = @"\bxox[baprs]-[A-Za-z0-9-]{10,}";
  let iban_hu = @"\bHU\d{2}(?: ?\d{4}){6}\b";
  LLMAppLogs_CL
  | where event_type in ("completion", "tool_call")
  | extend Output = iff(event_type == "completion", completion, tool_args)
  | where isnotempty(Output)
  | extend SecretTypes = set_difference(pack_array(
        iff(Output matches regex aws_key, "aws_access_key_id", ""),
        iff(Output matches regex secret_near_key, "secret_near_key", ""),
        iff(Output matches regex private_key, "private_key_pem", ""),
        iff(Output matches regex github_token, "github_token", ""),
        iff(Output matches regex slack_token, "slack_token", ""),
        iff(Output matches regex iban_hu, "iban_hu", "")), dynamic([""]))
  | where array_length(SecretTypes) > 0
  | project TimeGenerated, user_id, src_ip, session_id, request_id, event_type, tool_name, tool_target,
            SecretTypes, Output
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: user_id
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: src_ip
customDetails:
  SessionId: session_id
  SecretTypes: SecretTypes
  Channel: event_type
version: 1.0.0
kind: Scheduled
